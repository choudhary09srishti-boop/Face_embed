seed: 42

model:
  width: 0.25             # backbone width multiplier (0.25 -> ~0.4M params)
  fpn_channels: 64
  anchors_per_level: 2
  num_levels: 3
  strides: [8, 16, 32]
  min_sizes: [[16, 32], [64, 128], [256, 512]]
  variances: [0.1, 0.2]

data:
  label_file: data/widerface/train/label.txt
  images_root: data/widerface/train/images
  img_size: 640
  num_workers: 8

loss:
  iou_threshold: 0.35
  neg_pos_ratio: 7
  loc_weight: 2.0
  landmark_weight: 1.0
  use_focal: false

optim:
  lr: 0.01
  scale_lr: true
  momentum: 0.9
  weight_decay: 0.0005
  schedule: cosine
  warmup_steps: 1500
  min_lr_ratio: 0.01

train:
  out_dir: runs/detector
  epochs: 100
  batch_size: 24
  amp: true
  ema: true
  grad_clip: 10.0
  log_every: 50
  resume: null
